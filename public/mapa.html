<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body, html, #map {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      background: #0f172a;
      overflow: hidden;
    }
    /* Marcador clásico de origen / escena */
    .custom-marker-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px !important;
      height: 24px !important;
    }
    .custom-marker {
      width: 18px !important;
      height: 18px !important;
      border-radius: 50%;
      background: #ef4444;
      border: 3px solid #ffffff;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
      box-sizing: border-box;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    /* Marcador del muñequito en tiempo real */
    .walking-person-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px !important;
      height: 38px !important;
      background: #f97316;
      border: 2.5px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(249, 115, 22, 0.9);
      animation: pulse-walking 1.5s infinite;
    }
    .walking-person-marker svg {
      width: 22px;
      height: 22px;
      fill: #ffffff;
    }
    @keyframes pulse-walking {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.8); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(249, 115, 22, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); }
    }

    .popup-box {
      font-family: sans-serif;
      color: #cbd5e1;
    }
    .popup-box h3 {
      margin: 0 0 5px 0;
      font-size: 14px;
      color: #ef4444;
    }
    .popup-box p {
      margin: 0;
      font-size: 12px;
      color: #cbd5e1;
    }
    /* Estilo oscuro para tiles de OpenStreetMap */
    .dark-tiles .leaflet-tile {
      filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7);
    }
  </style>
</head>
<body class="dark-tiles">
  <div id="map"></div>
  <script>
    var defaultCenter = [-17.3895, -66.1568];
    var defaultZoom = 13;

    var map = L.map('map').setView(defaultCenter, defaultZoom);

    var tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap',
      maxZoom: 19
    }).addTo(map);

    // ResizeObserver para que Leaflet siempre conozca el centro exacto del contenedor
    if (window.ResizeObserver) {
      var ro = new ResizeObserver(function() {
        map.invalidateSize({ pan: false });
      });
      ro.observe(document.getElementById('map'));
    }
    window.addEventListener('resize', function() {
      map.invalidateSize({ pan: false });
    });

    var markersMap = {}; // id_alerta -> L.marker (Punto de origen)
    var walkingMarkersMap = {}; // id_alerta -> L.marker (Muñequito en vivo)
    var polylineMap = {}; // id_alerta -> L.polyline (Línea de rastreo)
    var hasCenteredInitially = false;

    // SVG del muñequito caminando
    var walkingIconHtml = '<div class="walking-person-marker">' +
      '<svg viewBox="0 0 24 24">' +
      '<path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/>' +
      '</svg>' +
      '</div>';

    function renderAlerts(alertsList) {
      if (!Array.isArray(alertsList)) return;

      var currentIds = {};
      var currentWalkingIds = {};
      var validCoords = [];

      alertsList.forEach(function(alerta) {
        if (!alerta.latitud || !alerta.longitud) return;

        currentIds[alerta.id] = true;
        validCoords.push([alerta.latitud, alerta.longitud]);

        var fecha = new Date(alerta.created_at);
        var horaFormateada = fecha.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        var fechaFormateada = fecha.toLocaleDateString('es-ES');
        var vecinoNombre = (alerta.emisor?.nombre || 'Botón Físico / Anónimo');

        // Las alertas fijas (MEDICA, INCENDIO, DESASTRE) NO usan muñequito de rastreo
        var tipoNorm = (alerta.tipo || '').toUpperCase().trim();
        var esAlertaFija = (tipoNorm === 'MEDICA' || tipoNorm === 'MÉDICA' || tipoNorm === 'INCENDIO' || tipoNorm === 'DESASTRE');
        var esAlertaRastreable = !esAlertaFija;

        // 1. MARCADOR DE ORIGEN / ESCENA (Punto rojo)
        var tituloPopup = '🚨 ' + alerta.tipo + (esAlertaFija ? ' (Ubicación de Emergencia)' : ' (Lugar de Origen)');
        var popupEscena = '<div class="popup-box">' +
          '<h3>' + tituloPopup + '</h3>' +
          '<p><strong>Vecino:</strong> ' + vecinoNombre + '</p>' +
          '<p><strong>Origen:</strong> ' + alerta.origen + '</p>' +
          '<p><strong>Comunidad:</strong> ' + (alerta.comunidad?.nombre || 'General') + '</p>' +
          '<p><strong>Hora:</strong> ' + fechaFormateada + ' ' + horaFormateada + '</p>' +
          '</div>';

        if (markersMap[alerta.id]) {
          markersMap[alerta.id].setPopupContent(popupEscena);
        } else {
          var iconEscena = L.divIcon({
            html: '<div class="custom-marker"></div>',
            className: 'custom-marker-wrapper',
            iconSize: [24, 24],
            iconAnchor: [12, 12]
          });

          var marker = L.marker([alerta.latitud, alerta.longitud], { icon: iconEscena })
            .bindPopup(popupEscena, { autoPan: false })
            .addTo(map);

          marker.on('click', function() {
            window.parent.postMessage({ type: 'SELECT_ALERTA', id: alerta.id }, '*');
          });

          markersMap[alerta.id] = marker;
        }

        // 2. MARCADOR DEL MUÑEQUITO (Rastreo móvil en vivo)
        // Solo para alertas rastreables (ROBO, SOS, etc. - NUNCA en médica, incendio o desastre)
        var latActual = (alerta.latitud_actual != null) ? alerta.latitud_actual : alerta.latitud;
        var lngActual = (alerta.longitud_actual != null) ? alerta.longitud_actual : alerta.longitud;

        if (esAlertaRastreable) {
          currentWalkingIds[alerta.id] = true;
          validCoords.push([latActual, lngActual]);

          var popupMuñeco = '<div class="popup-box">' +
            '<h3 style="color:#f97316;">🚶 Rastreo en Vivo</h3>' +
            '<p><strong>Víctima:</strong> ' + vecinoNombre + '</p>' +
            '<p><strong>Alerta:</strong> ' + alerta.tipo + '</p>' +
            '<p style="color:#38bdf8;"><em>Actualizando GPS en tiempo real...</em></p>' +
            '</div>';

          if (walkingMarkersMap[alerta.id]) {
            var currentPos = walkingMarkersMap[alerta.id].getLatLng();
            if (currentPos.lat !== latActual || currentPos.lng !== lngActual) {
              walkingMarkersMap[alerta.id].setLatLng([latActual, lngActual]);
            }
            walkingMarkersMap[alerta.id].setPopupContent(popupMuñeco);
          } else {
            var walkingIcon = L.divIcon({
              html: walkingIconHtml,
              className: '',
              iconSize: [38, 38],
              iconAnchor: [19, 19]
            });

            var walkingMarker = L.marker([latActual, lngActual], { icon: walkingIcon })
              .bindPopup(popupMuñeco, { autoPan: false })
              .addTo(map);

            walkingMarker.on('click', function() {
              window.parent.postMessage({ type: 'SELECT_ALERTA', id: alerta.id }, '*');
            });

            walkingMarkersMap[alerta.id] = walkingMarker;
          }

          // Línea de trayectoria que une la escena inicial con el muñequito si se ha movido
          if (latActual !== alerta.latitud || lngActual !== alerta.longitud) {
            var pathPoints = [[alerta.latitud, alerta.longitud], [latActual, lngActual]];
            if (polylineMap[alerta.id]) {
              polylineMap[alerta.id].setLatLngs(pathPoints);
            } else {
              polylineMap[alerta.id] = L.polyline(pathPoints, {
                color: '#f97316',
                weight: 3,
                opacity: 0.8,
                dashArray: '6, 8'
              }).addTo(map);
            }
          }
        }
      });

      // Limpiar marcadores de alertas desactivadas
      for (var id in markersMap) {
        if (!currentIds[id]) {
          map.removeLayer(markersMap[id]);
          delete markersMap[id];
        }
      }
      // Limpiar muñequitos que ya no existan o pertenezcan a alertas fijas
      for (var id in walkingMarkersMap) {
        if (!currentWalkingIds[id]) {
          map.removeLayer(walkingMarkersMap[id]);
          delete walkingMarkersMap[id];
        }
      }
      for (var id in polylineMap) {
        if (!currentWalkingIds[id]) {
          map.removeLayer(polylineMap[id]);
          delete polylineMap[id];
        }
      }

      // Auto-centrar la primera vez
      if (!hasCenteredInitially && validCoords.length > 0) {
        hasCenteredInitially = true;
        var bounds = L.latLngBounds(validCoords);
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
      }
    }

    window.addEventListener('message', function(event) {
      if (!event.data) return;

      if (event.data.type === 'SET_THEME') {
        if (event.data.theme === 'dark') {
          document.body.className = 'dark-tiles';
          document.body.style.background = '#0f172a';
        } else {
          document.body.className = '';
          document.body.style.background = '#f8fafc';
        }
      } else if (event.data.type === 'UPDATE_ALERTS') {
        renderAlerts(event.data.alerts);
      } else if (event.data.type === 'UPDATE_COORDS') {
        var id = event.data.id;
        var lat = Number(event.data.lat);
        var lng = Number(event.data.lng);
        var tipoNorm = event.data.tipo ? String(event.data.tipo).toUpperCase().trim() : '';
        var esAlertaFija = (tipoNorm === 'MEDICA' || tipoNorm === 'MÉDICA' || tipoNorm === 'INCENDIO' || tipoNorm === 'DESASTRE');

        if (esAlertaFija) {
          // Las alertas médicas, de incendio y desastre no usan muñequito
          return;
        }

        if (id && lat && lng) {
          if (walkingMarkersMap[id]) {
            walkingMarkersMap[id].setLatLng([lat, lng]);
            if (markersMap[id]) {
              var posOrigen = markersMap[id].getLatLng();
              var pathPoints = [posOrigen, [lat, lng]];
              if (polylineMap[id]) {
                polylineMap[id].setLatLngs(pathPoints);
              } else {
                polylineMap[id] = L.polyline(pathPoints, {
                  color: '#f97316',
                  weight: 3,
                  opacity: 0.8,
                  dashArray: '6, 8'
                }).addTo(map);
              }
            }
          } else if (markersMap[id]) {
            var walkingIcon = L.divIcon({
              html: walkingIconHtml,
              className: '',
              iconSize: [38, 38],
              iconAnchor: [19, 19]
            });
            var wm = L.marker([lat, lng], { icon: walkingIcon }).addTo(map);
            wm.on('click', function() {
              window.parent.postMessage({ type: 'SELECT_ALERTA', id: id }, '*');
            });
            walkingMarkersMap[id] = wm;
            if (markersMap[id]) {
              polylineMap[id] = L.polyline([markersMap[id].getLatLng(), [lat, lng]], {
                color: '#f97316',
                weight: 3,
                opacity: 0.8,
                dashArray: '6, 8'
              }).addTo(map);
            }
          }
        }
      } else if (event.data.type === 'FOCUS_MARKER') {
        var id = event.data.id;
        var lat = Number(event.data.lat);
        var lng = Number(event.data.lng);

        // 1. Recalcular dimensiones reales del contenedor del mapa sin paneo erroneo
        map.invalidateSize({ pan: false, reset: true });

        // 2. Determinar el marcador que se debe enfocar
        var targetMarker = walkingMarkersMap[id] || markersMap[id];
        var targetLatLng = targetMarker ? targetMarker.getLatLng() : (lat && lng ? L.latLng(lat, lng) : null);

        if (!targetLatLng) return;

        // 3. Cerrar cualquier popup previo para que no interfiera
        map.closePopup();

        // 4. Si hay dos marcadores (escena original y victima en movimiento) distanciados:
        if (markersMap[id] && walkingMarkersMap[id]) {
          var posOrigen = markersMap[id].getLatLng();
          var posActual = walkingMarkersMap[id].getLatLng();
          var distancia = posOrigen.distanceTo(posActual); // distancia en metros

          if (distancia > 50) {
            var bounds = L.latLngBounds([posOrigen, posActual]);
            map.fitBounds(bounds, { padding: [80, 80], maxZoom: 16 });
            setTimeout(function() {
              if (walkingMarkersMap[id]) {
                walkingMarkersMap[id].openPopup();
              }
            }, 250);
            return;
          }
        }

        // 5. Centrado matematico exacto en la coordenada objetivo
        map.setView(targetLatLng, 16, { animate: false });

        // 6. Abrir el popup exactamente sobre el marcador centrado
        setTimeout(function() {
          if (targetMarker) {
            targetMarker.openPopup();
          }
        }, 120);
      } else if (event.data.type === 'INVALIDATE_SIZE') {
        setTimeout(function() {
          map.invalidateSize();
        }, 60);
      }
    });

    window.parent.postMessage({ type: 'MAP_READY' }, '*');
  </script>
</body>
</html>
